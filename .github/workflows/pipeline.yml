name: pipeline project

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Push a main (directo o al mergear un PR) publica la imagen
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

jobs:
  unit-test:
    # Corre en cada PR y antes de publicar la imagen
    runs-on: ubuntu-latest
    env:
      # Valores de prueba: checkpoint.py exige DATABASE_URL al importarse
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: llama3.2:latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build:
    # Publica la imagen en ghcr.io solo si pasan los tests y no es un PR
    needs: unit-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
